name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Verify data engine (70 tests)
        run: npm test

      - name: Typecheck + build web bundle
        run: npm run build

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK (always works, no secrets needed)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      # ---- Signed release: only runs if you've added the 4 secrets ----
      - name: Decode keystore
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret - skipping signed release build."
          fi

      - name: Build signed release APK
        if: steps.ks.outputs.have == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scholarflow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: steps.ks.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scholarflow-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
